[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"
[functions]
  node_bundler = "esbuild"
  included_files = ["public/data/**"]
[functions."refresh"]
  schedule = "0 */6 * * *"
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/seo?path=/sitemap.xml"
  status = 200
[[redirects]]
  from = "/guide/build/*"
  to = "/.netlify/functions/seo?path=/guide/build/:splat"
  status = 200
[[redirects]]
  from = "/guide/builds/*"
  to = "/.netlify/functions/seo?path=/guide/builds/:splat"
  status = 200
[[redirects]]
  from = "/guide/news/*"
  to = "/.netlify/functions/seo?path=/guide/news/:splat"
  status = 200
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self'; img-src 'self' https: data: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://www.gstatic.com; frame-src https://nexus-mlbb.firebaseapp.com https://accounts.google.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
